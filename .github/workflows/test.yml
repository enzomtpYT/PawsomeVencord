name: Test
on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev
permissions:
    contents: read

jobs:
    Test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Run Tests
              run: pnpm test
